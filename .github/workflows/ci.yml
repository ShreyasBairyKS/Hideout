name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Build
        id: build
        run: npm run build 2>&1 | tee build_output.log
        env:
          CI: true
          # Hypothesis: the intermittent failure (3 of 4 runs so far) is a
          # webpack/terser memory spike on the runner's default V8 heap
          # ceiling, not a real code error. Source maps roughly double
          # memory use for a build this size, so disable them and raise
          # the heap limit explicitly while diagnosing.
          GENERATE_SOURCEMAP: false
          NODE_OPTIONS: --max-old-space-size=4096
        continue-on-error: true

      # TEMPORARY (re-added): the previous debug run happened to pass, so it
      # was reverted before the failure was confirmed fixed - it immediately
      # failed again on the very next run. Keeping this until we see the
      # actual error and/or a few consecutive green runs.
      - name: Show build output in job summary (debug)
        if: always()
        run: |
          echo '### Build output' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat build_output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
