name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --fetch-retries=5 --fetch-retry-mintimeout=20000

      - name: Build
        run: npm run build 2>&1 | tee build_output.log
        env:
          CI: true
          # The build failed intermittently (3 of 6 runs) with no source
          # changes between passing and failing runs - looked like a
          # webpack/terser memory spike against the runner's default V8
          # heap ceiling rather than a real code error. Source maps roughly
          # double memory use for a build this size; disabling them plus
          # raising the heap limit correlated with the failures stopping
          # (0 of 2 runs failed after adding this, vs 3 of 4 before).
          GENERATE_SOURCEMAP: false
          NODE_OPTIONS: --max-old-space-size=4096

      # This repo's Actions logs require sign-in to view even though it's
      # public, so upload the captured output as a downloadable artifact
      # whenever the build fails again, to make debugging possible.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-output-log
          path: frontend/build_output.log
          retention-days: 14
